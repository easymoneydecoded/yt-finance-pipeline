name: Morning Pipeline

on:
  schedule:
    # Ejecuta cada dia a las 06:00 UTC (08:00 hora espanola en verano)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Permite lanzarlo manualmente desde la web

jobs:
  generate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Etapa 1 - Generar ideas
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python morning_pipeline.py

      - name: Etapa 2 - Escribir guion
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python script_writer.py

      - name: Guardar ideas y guion como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: content-${{ github.run_id }}
          path: data/
          retention-days: 30
