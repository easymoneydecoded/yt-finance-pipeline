name: Morning Pipeline

on:
  schedule:
    # Un video al dia. Se programa para las 14:00 UTC (10:00 Nueva York); sus 3
    # Shorts los publica social.yml a las 15/19/23 UTC en YouTube, Instagram y TikTok.
    # GitHub retrasa (o a veces salta) los crons cuando esta saturado, sobre todo
    # en punto: por eso un minuto "raro", con margen, y una ejecucion de respaldo
    # que se salta sola si la primera ya publico.
    - cron: '17 5 * * *'
    - cron: '47 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo prueba: genera todo pero NO sube a YouTube (descarga los videos del artefacto)'
        type: boolean
        default: false

# Nunca dos ejecuciones a la vez: evitaba subir el mismo video dos veces
concurrency:
  group: morning-pipeline
  cancel-in-progress: false

# Necesario para guardar history/videos.json en el repo tras cada subida
permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'   # logs en directo (sin esto no se ve nada hasta que el paso termina)
  DRY_RUN: ${{ inputs.dry_run == true }}
  GEMINI_MODEL_SMART: ${{ vars.GEMINI_MODEL_SMART || 'gemini-3.5-flash' }}
  GEMINI_MODEL_FAST:  ${{ vars.GEMINI_MODEL_FAST || 'gemini-3.5-flash-lite' }}
  KOKORO_VOICE:       ${{ vars.KOKORO_VOICE || 'af_heart' }}

jobs:
  # Comprobacion rapida (~10s): si hoy ya se publico (p. ej. esta es la ejecucion
  # de respaldo y la primera funciono), no se repite todo el trabajo.
  check:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          SKIP=$(python3 -c "import content_history as ch, datetime; t=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d'); print('true' if ch.already_uploaded_on(t) else 'false')")
          if [ "${{ github.event_name }}" != "schedule" ]; then SKIP=false; fi
          echo "Ya publicado hoy: $SKIP"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  generate-content:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04   # fijado: ubuntu-latest pasa a Ubuntu 26 y podria cambiar paquetes
    timeout-minutes: 300

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache de modelos (Kokoro, Whisper)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/whisper
          key: models-v1

      - name: Instalar dependencias del sistema (ffmpeg, espeak-ng, fuentes)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Instalar dependencias Python (PyTorch CPU + resto)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Etapa 0 - Aprender de los resultados del canal
        timeout-minutes: 5
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python analytics.py

      - name: Etapa 1 - Generar ideas
        timeout-minutes: 45   # incluye esperas si Gemini esta saturado (llm.py)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python morning_pipeline.py

      - name: Etapa 2 - Guion, juez de calidad y fact-check
        timeout-minutes: 100  # el guionista reescribe hasta 60 min (+ esperas si Gemini se satura)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python script_writer.py

      - name: Etapa 3 - Voz (Kokoro)
        timeout-minutes: 25
        run: python voiceover.py

      - name: Etapa 4 - Descargar b-roll
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python b_roll.py

      - name: Etapa 5 - Montar video largo con visuales de datos
        timeout-minutes: 45
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python editor.py

      - name: Etapa 6 - Montar Shorts verticales
        timeout-minutes: 30
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python shorts_maker.py

      - name: Etapa 7 - Generar thumbnail con datos
        timeout-minutes: 10
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FRED_API_KEY:   ${{ secrets.FRED_API_KEY }}
        run: python thumbnail_maker.py

      - name: Etapa 8 - Subir y programar en YouTube (+ encolar Shorts)
        timeout-minutes: 30
        if: env.DRY_RUN != 'true'
        env:
          GITHUB_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python uploader.py

      # Se ejecuta aunque falle algo despues de subir: el historial es lo que
      # impide que manana se repita el mismo tema (y guarda las metricas)
      - name: Guardar historial del canal en el repo
        if: always()
        run: |
          if git diff --quiet -- history/; then
            echo "Historial sin cambios"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add history/
          git commit -m "Historial: $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "No se pudo guardar el historial" && exit 1

      - name: Aviso por Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS:         ${{ job.status }}
        run: python notify.py pipeline || true

      - name: Guardar artefacto (metadata + thumbnail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-${{ github.run_id }}
          path: |
            data/*.json
            data/*.md
            data/*.txt
            data/audio/*.json
            data/broll/*.json
            data/output/*.json
            data/output/thumbnail_*.png
            data/output/thumbnail_*.jpg
            history/videos.json
          retention-days: 3

      - name: Guardar videos (solo en modo prueba)
        if: always() && env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: data/output/*.mp4
          retention-days: 3
