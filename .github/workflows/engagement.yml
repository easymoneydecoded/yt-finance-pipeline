name: Engagement (comentarios)

# YouTube no deja comentar un video programado hasta que se publica.
# Este job ligero (~1 min) publica el comentario del canal y el enlace de los
# Shorts poco despues de cada franja de publicacion (14, 18 y 22 UTC).
on:
  schedule:
    - cron: '25 14,18,22 * * *'
  workflow_dispatch:

concurrency:
  group: engagement
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias minimas
        run: pip install google-api-python-client google-auth python-dotenv requests

      - name: Publicar comentarios pendientes
        env:
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python engagement.py

      - name: Guardar historial
        run: |
          if git diff --quiet -- history/; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add history/
          git commit -m "Engagement: comentarios $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
