name: Social (Shorts a YouTube, Instagram y TikTok)

# Publica el siguiente Short de la cola en YouTube Shorts, Instagram Reels y
# TikTok (borrador o directo). 3 veces al dia, despues del video de las 14:00:
# 15:07, 19:07 y 23:07 UTC = 11:07, 15:07 y 19:07 en Nueva York.
# Tambien publica los comentarios pendientes de los videos largos.
on:
  schedule:
    - cron: '7 15,19,23 * * *'
    # Respaldo: GitHub a veces retrasa o se salta un cron. social_publisher.py
    # recuerda la franja ya cubierta (history/social_slots.json) y no repite.
    - cron: '37 15,19,23 * * *'
    - cron: '7 16,20,0 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Solo comprobar credenciales de Instagram, TikTok y Telegram (no publica nada)'
        type: boolean
        default: false
      ig_debug:
        description: 'Diagnostico de la subida a Instagram (sube el siguiente Short SIN publicarlo)'
        type: boolean
        default: false
      only_retries:
        description: 'Solo reintentar las redes que fallaron (no publica el siguiente Short)'
        type: boolean
        default: false

concurrency:
  group: social
  cancel-in-progress: false

# contents: write -> leer/borrar los MP4 del release "shorts-queue" y guardar la cola
permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias minimas
        run: pip install google-api-python-client google-auth python-dotenv requests cryptography

      - name: Publicar el siguiente Short
        env:
          GITHUB_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_TOKEN:       ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID:     ${{ secrets.INSTAGRAM_USER_ID }}
          TIKTOK_CLIENT_KEY:     ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET:  ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN:  ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODE:           ${{ vars.TIKTOK_MODE || 'draft' }}
          ONLY_RETRIES:          ${{ inputs.only_retries == true }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.ig_debug }}" = "true" ]; then
            python instagram.py debug
          elif [ "${{ inputs.check_only }}" = "true" ]; then
            python instagram.py check || echo '!! Instagram: fallo la comprobacion'
            python tiktok.py check || echo '!! TikTok: fallo la comprobacion'
            python notify.py test || echo '!! Telegram: fallo la comprobacion'
          else
            python social_publisher.py
          fi

      - name: Aviso de fallo por Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py social_failed || true

      - name: Guardar cola e historial
        if: always()
        run: |
          if git diff --quiet -- history/; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add history/
          git commit -m "Social: Shorts publicados $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
