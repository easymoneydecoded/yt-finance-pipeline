name: Insider Alerts (Telegram)

# Compras de directivos (SEC Form 4) -> canal premium de Telegram, cada hora en
# dias laborables mientras la SEC acepta filings (8:00-22:00 Nueva York).
# Cada noche a las 03:40 UTC, cuando la SEC ya ha cerrado el dia: resumen en
# Telegram (gratis + premium), web tickerpress.net (Cloudflare Pages) y post en
# Bluesky / X / Threads (insider_social.py).
on:
  schedule:
    - cron: '23 12-23 * * 1-5'
    - cron: '23 0-2 * * 2-6'
    - cron: '40 3 * * 2-6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'scan = avisos nuevos · recap = scan + resumen + web + redes · site = solo web · check = comprobar bot y canales'
        type: choice
        options: [scan, recap, site, check]
        default: scan
      dry_run:
        description: 'Modo prueba: escribe los mensajes en el log en vez de enviarlos'
        type: boolean
        default: false

concurrency:
  group: insider-alerts
  cancel-in-progress: false

# contents: write -> guardar site_data/ (historico de compras de la web)
permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  DRY_RUN: ${{ inputs.dry_run == true }}

jobs:
  alerts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias minimas
        run: pip install requests python-dotenv yfinance requests-oauthlib

      # El estado (Form 4 ya vistos, avisos del dia) vive en la cache de Actions
      # y no en el repo: asi no hay un commit cada hora. Si se pierde, el script
      # solo mira las ultimas 3 horas y no repite avisos viejos.
      - name: Recuperar estado
        uses: actions/cache/restore@v4
        with:
          path: history/insider_state.json
          key: insider-state-${{ github.run_id }}
          restore-keys: insider-state-

      - name: Avisos
        id: mode
        env:
          TELEGRAM_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERTS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          ALERTS_PREMIUM_CHAT: ${{ vars.ALERTS_PREMIUM_CHAT }}
          ALERTS_FREE_CHAT:    ${{ vars.ALERTS_FREE_CHAT }}
          ALERTS_PREMIUM_LINK: ${{ vars.ALERTS_PREMIUM_LINK }}
          SEC_CONTACT:         ${{ secrets.SEC_CONTACT }}
          MIN_BUY_USD:         ${{ vars.MIN_BUY_USD }}
          MIN_SELL_USD:        ${{ vars.MIN_SELL_USD }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            [ "${{ github.event.schedule }}" = "40 3 * * 2-6" ] && MODE=recap || MODE=scan
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          case "$MODE" in
            check) python insider_alerts.py check ;;
            recap) python insider_alerts.py scan && python insider_alerts.py recap ;;
            site)  ;;
            *)     python insider_alerts.py scan ;;
          esac

      - name: Web (tickerpress.net)
        if: (steps.mode.outputs.mode == 'recap' || steps.mode.outputs.mode == 'site') && inputs.dry_run != true
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python insider_site.py update
          python insider_site.py build
          npx --yes wrangler@3 pages deploy site_dist --project-name=tickerpress --branch=main --commit-dirty=true

      - name: Redes (Bluesky, X, Threads)
        if: steps.mode.outputs.mode == 'recap' && inputs.dry_run != true
        continue-on-error: true
        env:
          BLUESKY_HANDLE:       ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          X_API_KEY:            ${{ secrets.X_API_KEY }}
          X_API_SECRET:         ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:       ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:      ${{ secrets.X_ACCESS_SECRET }}
          THREADS_TOKEN:        ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID:      ${{ vars.THREADS_USER_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}   # clave de secret_store (token renovado de Threads)
          MIN_BUY_USD:          ${{ vars.MIN_BUY_USD }}
        run: python insider_social.py

      - name: Guardar historico de la web (y token renovado de Threads)
        if: (steps.mode.outputs.mode == 'recap' || steps.mode.outputs.mode == 'site') && inputs.dry_run != true
        run: |
          if [ -z "$(git status --porcelain -- site_data/ history/)" ]; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A site_data/ history/
          git commit -m "Web: compras de directivos $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1

      - name: Guardar estado
        if: always() && hashFiles('history/insider_state.json') != '' && inputs.dry_run != true
        uses: actions/cache/save@v4
        with:
          path: history/insider_state.json
          key: insider-state-${{ github.run_id }}

      - name: Aviso de fallo por Telegram
        if: failure() && inputs.mode != 'check'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "import notify; notify.send('❌ <b>Fallo el bot de Insider Alerts</b>\n<a href=\"' + notify.run_url() + '\">Ver el log en GitHub</a>')" || true
